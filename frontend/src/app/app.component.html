<!-- Test of SCSS and API connection -->
<div class="container">
  <div class="card">
    <h1 class="title">Impact Partnership Project</h1>
    
    <p class="subtitle">Testing connection to Flask Backend:</p>
    
    <!-- 
      Display message from Flask API.
      'message$' is an Observable, | async subscribes to it for us.
    -->
    <div *ngIf="message$ | async as msg; else loading" 
         class="message" 
         [ngClass]="msg.error ? 'error' : 'success'">
      <strong *ngIf="!msg.error">Success!</strong>
      <strong *ngIf="msg.error">Error:</strong>
      {{ msg.message }}
    </div>
    
    <!-- Template while loading -->
    <ng-template #loading>
      <div class="message loading">
        <strong>Loading...</strong> Connecting to Flask server.
      </div>
    </ng-template>
  </div>
</div>

<router-outlet></router-outlet>
