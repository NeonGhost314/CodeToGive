<!-- Section Photo -->
<div class="org-photo-section">
  @if (fund.photoUrl) {
    <img [src]="fund.photoUrl" [alt]="fund.name + ' photo'" class="org-photo">
  } @else {
    <div class="org-photo-placeholder">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 19V5C21 3.9 20.1 3 19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19ZM8.5 13.5L11 16.51L14.5 12L19 18H5L8.5 13.5Z" fill="#999"/>
      </svg>
      <p class="placeholder-text">Ajouter une photo de l'organisation</p>
    </div>
  }
  <h1 class="org-name">{{ fund.name }}</h1>
</div>
