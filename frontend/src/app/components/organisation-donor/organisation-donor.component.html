<div class="organisation-donor-section">
  <h2 class="section-title">Become a sponsor</h2>
  
  <div class="section-content">
    <p class="description">
      If you are interested in making a significant contribution to our mission, please fill out this form 
      and send it to <a href="mailto:{{ email }}" class="email-link">{{ email }}</a>.
    </p>
    
    <div class="form-section">
      <button 
        class="download-btn"
        (click)="onDownloadForm()"
        aria-label="Download sponsorship form PDF">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" fill="currentColor"/>
        </svg>
        Download Sponsorship Form (PDF)
      </button>
    </div>
  </div>
</div>
