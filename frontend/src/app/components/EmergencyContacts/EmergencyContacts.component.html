<div class="emergency-section">
    <div class="section-header">
        <h2>Important Numbers</h2>
        <p>24/7 Support & Resources</p>
    </div>

    <div class="contacts-list">
        <div class="contact-group" *ngFor="let contact of contacts; let i = index" (mouseenter)="onCardMouseEnter(i)"
            (mouseleave)="onCardMouseLeave(i)">

            <!-- Three.js Effect Canvas -->
            <div #effectCanvas1 *ngIf="i === 0" class="effect-canvas"></div>
            <div #effectCanvas2 *ngIf="i === 1" class="effect-canvas"></div>
            <div #effectCanvas3 *ngIf="i === 2" class="effect-canvas"></div>
            <div #effectCanvas4 *ngIf="i === 3" class="effect-canvas"></div>

            <h3 class="contact-title">{{ contact.title }}</h3>

            <div class="phone-numbers">
                <a *ngFor="let phone of contact.numbers" [href]="'tel:' + phone.number" class="phone-link"
                    [class.primary]="phone.isPrimary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span class="phone-text">
                        <span class="phone-label" *ngIf="phone.label">{{ phone.label }}</span>
                        <span class="phone-number">{{ phone.number }}</span>
                    </span>
                </a>
            </div>
        </div>
    </div>
</div>
