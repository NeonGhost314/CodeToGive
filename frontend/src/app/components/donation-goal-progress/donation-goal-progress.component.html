<div class="goal-progress">
  <div class="goal-header">
    <div class="goal-info">
      <span class="current-amount">${{ formatNumber(currentAmount) }}</span>
      <span class="goal-amount">/ ${{ formatNumber(goalAmount) }}</span>
    </div>
  </div>
  
  <div class="progress-bar-container">
    <div class="progress-bar" [style.width.%]="progressPercentage">
      <div class="progress-fill"></div>
    </div>
    <div 
      class="potential-progress-bar" 
      [style.width.%]="potentialAdditionPercentage"
      [style.left.%]="progressPercentage"
      *ngIf="potentialAmount > 0">
      <div class="potential-progress-fill"></div>
    </div>
  </div>
  
  <div class="goal-footer">
    <span class="remaining-text">${{ formatNumber(remaining) }} remaining to reach the goal</span>
  </div>
</div>
