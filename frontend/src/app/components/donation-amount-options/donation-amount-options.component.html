<div class="amount-options">
  <h2 class="options-title">Build Your Impact</h2>
  <div class="options-grid">
    @for (option of allOptions; track option.fundId || option.title || option.isCustom) {
      <app-donation-amount-card
        [option]="option"
        [isSelected]="isSelected(option)"
        (select)="onOptionSelected($event)">
      </app-donation-amount-card>
    }
  </div>
</div>
