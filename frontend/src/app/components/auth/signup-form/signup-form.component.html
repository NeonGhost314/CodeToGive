<form class="signup-form" (ngSubmit)="onSubmit()">
  <div class="form-section">
    <label class="form-label" for="signup-firstname">First Name*</label>
    <input
      type="text"
      id="signup-firstname"
      class="form-input"
      [(ngModel)]="firstName"
      name="firstName"
      placeholder="John"
      required>
  </div>

  <div class="form-section">
    <label class="form-label" for="signup-lastname">Last Name*</label>
    <input
      type="text"
      id="signup-lastname"
      class="form-input"
      [(ngModel)]="lastName"
      name="lastName"
      placeholder="Doe"
      required>
  </div>

  <div class="form-section">
    <label class="form-label" for="signup-email">Email*</label>
    <input
      type="email"
      id="signup-email"
      class="form-input"
      [(ngModel)]="email"
      name="email"
      placeholder="your.email@example.com"
      required>
  </div>

  <div class="form-section">
    <label class="form-label" for="signup-password">Password*</label>
    <input
      type="password"
      id="signup-password"
      class="form-input"
      [(ngModel)]="password"
      name="password"
      placeholder="At least 6 characters"
      required>
    <span class="form-hint">Password must be at least 6 characters</span>
  </div>

  <div class="form-section">
    <label class="form-label" for="signup-confirm-password">Confirm Password*</label>
    <input
      type="password"
      id="signup-confirm-password"
      class="form-input"
      [(ngModel)]="confirmPassword"
      name="confirmPassword"
      placeholder="Re-enter your password"
      required>
  </div>

  @if (error) {
    <div class="error-message">
      {{ error }}
    </div>
  }

  <button
    type="submit"
    class="submit-button"
    [disabled]="isSubmitting"
    [class.disabled]="isSubmitting">
    @if (isSubmitting) {
      <span class="loading-spinner"></span>
      Creating account...
    } @else {
      Create Account
    }
  </button>
</form>
