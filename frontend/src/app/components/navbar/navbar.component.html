<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-left">
            <a routerLink="/" class="navbar-brand">
                <img src="/logo.png" alt="Shield of Athena" class="brand-logo" />
            </a>
        </div>

        <div class="navbar-center">
            <p class="campaign-slogan">
                <span class="slogan-highlight">The Shield of Athena</span> — a leader in community outreach and
                prevention of conjugal violence, launching their new campaign during the designated days of
                action regarding violence against women.
            </p>
        </div>

        <div class="navbar-right">
            <nav class="nav-links">
                <a routerLink="/" class="nav-link">Our Mission</a>
                <a href="#how-we-help" class="nav-link">Services</a>
                <a href="#impact-stats" class="nav-link">Impact</a>
            </nav>

            <!-- Language Dropdown -->
            <div class="language-selector" (clickOutside)="closeDropdown()">
                <button class="language-btn" (click)="toggleDropdown()">
                    <img [src]="'https://flagcdn.com/24x18/' + selectedLanguage.flagCode + '.png'" 
                         [alt]="selectedLanguage.name" 
                         class="flag-img" />
                    <span class="language-name">{{ selectedLanguage.name }}</span>
                    <svg class="dropdown-icon" [class.open]="isDropdownOpen" width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <div class="language-dropdown" [class.open]="isDropdownOpen">
                    <div class="language-grid">
                        <button 
                            *ngFor="let lang of languages" 
                            class="language-option"
                            [class.selected]="lang.code === selectedLanguage.code"
                            (click)="selectLanguage(lang)">
                            <img [src]="'https://flagcdn.com/24x18/' + lang.flagCode + '.png'" 
                                 [alt]="lang.name" 
                                 class="flag-img" />
                            <span class="language-name">{{ lang.name }}</span>
                        </button>
                    </div>
                </div>
            </div>

            <a href="https://www.canadahelps.org/en/dn/27709" target="_blank" class="btn-donate">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                        fill="currentColor" />
                </svg>
                <span>Support Us</span>
            </a>
        </div>
    </div>
</nav>
