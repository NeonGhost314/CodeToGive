<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-left">
            <a routerLink="/" class="navbar-brand">
                <img src="/logo.png" alt="Shield of Athena" class="brand-logo" />
            </a>
        </div>

        <div class="navbar-center">
            <p class="campaign-slogan">
                <span class="slogan-highlight">The Shield of Athena</span> — a leader in preventing conjugal violence, launching their new campaign during the days of action against violence towards women.
            </p>
        </div>

        <div class="navbar-right">
            @if (showSupportButton) {
                <a routerLink="/donation" class="btn-donate" title="Support Us">
                    <i class="fas fa-heart"></i>
                    <span>Support Us</span>
                </a>
            }

            @if (isAuthenticated) {
                <div class="user-menu-container">
                    <button class="user-menu-button" (click)="toggleUserMenu($event)" type="button" title="Account Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                    @if (showUserMenu) {
                        <div class="user-menu-dropdown">
                            <button class="menu-item" (click)="goToDashboard()" title="Dashboard">
                                <i class="fas fa-th-large"></i>
                            </button>
                            <button class="menu-item" (click)="logout()" title="Logout">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </div>
                    }
                </div>
            } @else if (showLoginButton) {
                <button class="btn-login" (click)="goToLogin()" type="button" title="Login">
                    <i class="fas fa-user"></i>
                </button>
            }
            <!-- Language Dropdown -->
            <div class="language-selector">
                <button class="language-btn" (click)="toggleDropdown()">
                    <img [src]="'https://flagcdn.com/24x18/' + selectedLanguage.flagCode + '.png'" 
                         [alt]="selectedLanguage.name" 
                         class="flag-img" />
                    <span class="language-name">{{ selectedLanguage.name }}</span>
                    <svg class="dropdown-icon" [class.open]="isDropdownOpen" width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <div class="language-dropdown" [class.open]="isDropdownOpen">
                    <div class="language-grid">
                        <button 
                            *ngFor="let lang of languages" 
                            class="language-option"
                            [class.selected]="lang.code === selectedLanguage.code"
                            (click)="selectLanguage(lang)">
                            <img [src]="'https://flagcdn.com/24x18/' + lang.flagCode + '.png'" 
                                 [alt]="lang.name" 
                                 class="flag-img" />
                            <span class="language-name">{{ lang.name }}</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>
