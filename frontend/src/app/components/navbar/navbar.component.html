<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-left">
            <a routerLink="/" class="navbar-brand">
                <img src="/logo.png" alt="Shield of Athena" class="brand-logo" />
            </a>
        </div>

        <div class="navbar-center">
            <p class="campaign-slogan">
                <span class="slogan-highlight">The Shield of Athena</span> — a leader in preventing conjugal violence, launching their new campaign during the days of action against violence towards women.
            </p>
        </div>

        <div class="navbar-right">
            @if (showSupportButton) {
                <a routerLink="/donation" class="btn-donate" title="Support Us">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                            fill="currentColor" />
                    </svg>
                    <span>Support Us</span>
                </a>
            }

            @if (isAuthenticated) {
                <div class="user-menu-container">
                    <button class="user-menu-button" (click)="toggleUserMenu($event)" type="button" title="Account Settings">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19.14 12.94C19.18 12.64 19.2 12.33 19.2 12C19.2 11.67 19.18 11.36 19.14 11.06L21.16 9.48C21.34 9.33 21.39 9.07 21.28 8.86L19.36 5.14C19.25 4.93 19.01 4.85 18.8 4.93L16.5 5.97C16.07 5.65 15.6 5.39 15.09 5.2L14.78 2.75C14.75 2.54 14.58 2.38 14.37 2.38H9.63C9.42 2.38 9.25 2.54 9.22 2.75L8.91 5.2C8.4 5.39 7.93 5.65 7.5 5.97L5.2 4.93C4.99 4.85 4.75 4.93 4.64 5.14L2.72 8.86C2.61 9.07 2.66 9.33 2.84 9.48L4.86 11.06C4.82 11.36 4.8 11.67 4.8 12C4.8 12.33 4.82 12.64 4.86 12.94L2.84 14.52C2.66 14.67 2.61 14.93 2.72 15.14L4.64 18.86C4.75 19.07 4.99 19.15 5.2 19.07L7.5 18.03C7.93 18.35 8.4 18.61 8.91 18.8L9.22 21.25C9.25 21.46 9.42 21.62 9.63 21.62H14.37C14.58 21.62 14.75 21.46 14.78 21.25L15.09 18.8C15.6 18.61 16.07 18.35 16.5 18.03L18.8 19.07C19.01 19.15 19.25 19.07 19.36 18.86L21.28 15.14C21.39 14.93 21.34 14.67 21.16 14.52L19.14 12.94ZM12 15.6C10.02 15.6 8.4 13.98 8.4 12C8.4 10.02 10.02 8.4 12 8.4C13.98 8.4 15.6 10.02 15.6 12C15.6 13.98 13.98 15.6 12 15.6Z" fill="currentColor"/>
                        </svg>
                    </button>
                    @if (showUserMenu) {
                        <div class="user-menu-dropdown">
                            <button class="menu-item" (click)="goToDashboard()" title="Dashboard">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                    <path d="M3 13H11V3H3V13ZM3 21H11V15H3V21ZM13 21H21V11H13V21ZM13 3V9H21V3H13Z" fill="currentColor"/>
                                </svg>
                            </button>
                            <button class="menu-item" (click)="logout()" title="Logout">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                    <path d="M17 7L15.59 8.41L18.17 11H8V13H18.17L15.59 15.59L17 17L22 12L17 7ZM4 5H12V3H4C2.9 3 2 3.9 2 5V19C2 20.1 2.9 21 4 21H12V19H4V5Z" fill="currentColor"/>
                                </svg>
                            </button>
                        </div>
                    }
                </div>
            } @else if (showLoginButton) {
                <button class="btn-login" (click)="goToLogin()" type="button" title="Login">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" fill="currentColor"/>
                        <path d="M12.0002 14.5C6.99016 14.5 2.91016 17.86 2.91016 22C2.91016 22.28 3.13016 22.5 3.41016 22.5H20.5902C20.8702 22.5 21.0902 22.28 21.0902 22C21.0902 17.86 17.0102 14.5 12.0002 14.5Z" fill="currentColor"/>
                    </svg>
                </button>
            }
        </div>
    </div>
</nav>
