<div class="video-page">

  <!-- NAVBAR -->
  <app-navbar></app-navbar>

  <!-- HERO TEXT -->
  <section class="hero">
    <h1>Follow a Journey of Hope</h1>

    <p class="subtitle">
      Each chapter reveals a real transformation story. Your support helps create
      safety, healing, and a new beginning for those rebuilding from trauma.
    </p>
  </section>

  <!-- MAIN CONTENT -->
  <section class="main-content">
    
    <!-- JOURNEY PROGRESS TRACKER -->
    <app-video-journey></app-video-journey>

    <!-- VIDEO PLAYER -->
    <div class="video-container">
      <div class="video-wrapper">
        <div class="chapter-badge">Chapter 1</div>
        <app-video-player [videoSrc]="'assets/videos/athena-arrival.mp4'"></app-video-player>
      </div>
    </div>

    <!-- EVENTS COMPONENT -->
    <app-video-events></app-video-events>

  </section>

</div>
